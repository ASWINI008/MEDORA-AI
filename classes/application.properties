# Application Info
spring.application.name=medora-backend
server.port=8080

# Database Settings (Defaults to persistent H2 on disk with PostgreSQL compatibility mode, overridable for real PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/medoradb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Event Processing (Kafka)
medora.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (for developer debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configurations
medora.jwt.secret=${MEDORA_JWT_SECRET:9a4f2c8d3e7b1a5c6f8e2d4c0b9a8f7e6d5c4b3a2a1b0c9d8e7f6a5b4c3d2e1f}
medora.jwt.expiration-ms=${MEDORA_JWT_EXPIRATION:86400000}

# Python FastAPI AI Service URL
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Logging Configurations
logging.level.org.springframework.security=INFO
logging.level.com.medora.backend=INFO
